services:
  api:
    build: .
    container_name: ilovepdf-api
    # Port 8000 is NOT published by default (safe-by-default). To expose the
    # API publicly, uncomment the ports block below — and set API_TOKEN.
    # ports:
    #   - "8000:8000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
      # API_TOKEN: set a strong token here to enable bearer auth
      # CORS_ORIGINS: comma-separated allowlist, e.g. "https://app.example.com"
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000